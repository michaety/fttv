<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04080b">
<title>MDE TV Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* Served by the MDE TV app (PhoneRemote.kt) on the TV's Wi-Fi address. */
  :root {
    --bg: #04080b; --panel: #12191f; --line: #1a272b;
    --accent: #25ff06; --yellow: #fff105; --text: #ffffff; --dim: #8fa3ad;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: 'Share Tech Mono', ui-monospace, monospace; -webkit-tap-highlight-color: transparent; }
  body { padding: 0 0 calc(150px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 16px 10px;
    border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .brand b { font-family: 'Doto', monospace; font-size: 28px; letter-spacing: 2px; }
  .brand span { color: var(--accent); font-size: 14px; letter-spacing: 1px; }
  form { display: flex; }
  input[type=search] { flex: 1; min-width: 0; background: #000; color: var(--text); border: 2px solid var(--line);
    border-right: 0; padding: 10px 12px; font: inherit; font-size: 16px; border-radius: 0; -webkit-appearance: none; }
  input[type=search]:focus { outline: none; border-color: var(--accent); }
  form button { background: var(--panel); color: var(--text); border: 2px solid var(--line); font: inherit;
    font-size: 15px; letter-spacing: 1px; padding: 0 14px; }
  section { padding: 18px 0 4px; }
  h2 { font-family: 'Doto', monospace; font-size: 20px; letter-spacing: 3px; margin: 0 16px 10px; text-transform: uppercase; }
  h2::before { content: '[ '; color: var(--accent); }
  h2::after { content: ' ]'; color: var(--accent); }
  .row { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 6px; scrollbar-width: none; scroll-snap-type: x proximity; }
  .row::-webkit-scrollbar { display: none; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px 12px; padding: 0 16px; }
  .card { flex: 0 0 62%; max-width: 260px; scroll-snap-align: start; background: none; border: 0; padding: 0;
    color: inherit; text-align: left; font: inherit; cursor: pointer;
    display: flex; flex-direction: column; justify-content: flex-start; }
  .row { align-items: flex-start; }
  .grid .card { max-width: none; }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: var(--panel) center / cover no-repeat;
    border: 2px solid var(--line); }
  .card:active .thumb { border-color: var(--accent); }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.3); }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .tag { position: absolute; left: 0; right: 0; bottom: 0; padding: 2px 8px; background: rgba(0,0,0,.78);
    color: var(--accent); font-size: 12px; letter-spacing: 1px; }
  .seen { position: absolute; top: 6px; right: 6px; padding: 1px 6px; background: rgba(0,0,0,.8);
    color: var(--accent); font-size: 11px; }
  .series { color: var(--dim); font-size: 12px; margin-top: 6px; text-transform: uppercase;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .series::before { content: '['; color: var(--yellow); } .series::after { content: ']'; color: var(--yellow); }
  .title { font-size: 15px; line-height: 1.25; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; }
  .empty { color: var(--dim); margin: 0 16px; font-size: 14px; }
  #banner { display: none; margin: 12px 16px 0; padding: 10px 12px; border: 2px solid var(--yellow); color: var(--yellow); font-size: 14px; }
  /* Now playing */
  #now { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--panel);
    border-top: 3px solid var(--accent); padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    transform: translateY(110%); transition: transform .2s; }
  #now.on { transform: none; }
  .np { display: flex; gap: 10px; align-items: center; }
  .np .thumb { flex: 0 0 96px; border-width: 1px; }
  .np .meta { min-width: 0; }
  .np .title { -webkit-line-clamp: 1; }
  .np .series { margin-top: 0; }
  .seek { display: flex; align-items: center; gap: 8px; margin: 10px 0 6px; font-size: 12px; color: var(--dim); }
  .seek input { flex: 1; accent-color: var(--accent); }
  .ctrls { display: flex; justify-content: space-between; gap: 8px; }
  .ctrls button { flex: 1; background: #000; color: var(--text); border: 2px solid var(--line); font: inherit;
    font-size: 16px; padding: 10px 0; }
  .ctrls button:active { border-color: var(--accent); color: var(--accent); }
  .ctrls .play { flex: 1.4; background: var(--accent); color: #000; border-color: var(--accent); font-weight: bold; }
</style>
</head>
<body>
<header>
  <div class="brand"><b>MDE</b><span>TV REMOTE</span></div>
  <form id="search">
    <input type="search" id="q" placeholder="Search" enterkeyhint="search" autocomplete="off">
    <button>SEARCH</button>
  </form>
</header>
<div id="banner"></div>
<main id="main">
  <section id="results" hidden><h2>Results</h2><div class="grid"></div></section>
  <section id="recent" hidden><h2>Continue watching</h2><div class="row"></div></section>
  <section id="new"><h2>New</h2><div class="row"><p class="empty">Loading…</p></div></section>
  <section id="popular"><h2>Popular</h2><div class="row"></div></section>
</main>
<div id="now">
  <div class="np">
    <div class="thumb" id="npThumb"></div>
    <div class="meta"><div class="series" id="npSeries"></div><div class="title" id="npTitle"></div></div>
  </div>
  <div class="seek"><span id="npT">0:00</span><input type="range" id="npBar" min="0" max="100" step="1" value="0"><span id="npDur">0:00</span></div>
  <div class="ctrls">
    <button data-seek="-30">−30</button>
    <button data-seek="-10">−10</button>
    <button class="play" id="npPlay">❚❚</button>
    <button data-seek="10">+10</button>
    <button data-seek="30">+30</button>
  </div>
</div>
<script>
(function(){
  var key = new URLSearchParams(location.search).get('k') || '';
  var $ = function(s){ return document.querySelector(s); };
  function api(path, params){
    var u = new URLSearchParams(params || {}); u.set('k', key);
    return fetch(path + '?' + u, { cache: 'no-store' }).then(function(r){
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  }
  function banner(text){ var b = $('#banner'); b.textContent = text || ''; b.style.display = text ? 'block' : 'none'; }
  function fmt(s){
    s = Math.max(0, Math.floor(s || 0));
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
  }

  function card(v){
    var b = document.createElement('button');
    b.className = 'card';
    var t = document.createElement('div');
    t.className = 'thumb';
    if (v.thumb) t.style.backgroundImage = 'url("' + v.thumb.replace(/"/g, '%22') + '")';
    if (v.next) { var n = document.createElement('div'); n.className = 'tag'; n.textContent = 'UP NEXT'; t.appendChild(n); }
    else if (v.progress > 0) { var bar = document.createElement('div'); bar.className = 'bar';
      bar.innerHTML = '<i style="width:' + Math.min(100, Math.max(2, v.progress * 100)) + '%"></i>'; t.appendChild(bar); }
    if (v.watched) { var w = document.createElement('div'); w.className = 'seen'; w.textContent = '✓ WATCHED'; t.appendChild(w); }
    var s = document.createElement('div'); s.className = 'series'; s.textContent = v.series || '';
    var ti = document.createElement('div'); ti.className = 'title'; ti.textContent = v.title || '';
    b.appendChild(t); if (v.series) b.appendChild(s); b.appendChild(ti);
    b.onclick = function(){ play(v); };
    return b;
  }
  function fill(id, list, emptyText){
    var sec = $('#' + id), box = sec.querySelector('.row, .grid');
    box.innerHTML = '';
    (list || []).forEach(function(v){ box.appendChild(card(v)); });
    if (!list || !list.length) {
      if (emptyText) box.innerHTML = '<p class="empty">' + emptyText + '</p>'; else { sec.hidden = true; return; }
    }
    sec.hidden = false;
  }

  function load(){
    api('/api/home').then(function(d){
      banner('');
      fill('recent', d.recent);
      fill('new', d['new'], 'Nothing here right now.');
      fill('popular', d.popular, 'Nothing here right now.');
    }).catch(offline);
  }
  function offline(e){
    banner(String(e && e.message) === '403'
      ? 'This link has expired. Scan the QR code in the TV app’s menu again.'
      : 'Can’t reach the TV. Open MDE TV on the TV and check you’re on the same Wi-Fi.');
  }

  $('#search').onsubmit = function(e){
    e.preventDefault();
    var q = $('#q').value.trim();
    $('#q').blur();
    if (!q) { $('#results').hidden = true; return; }
    var sec = $('#results');
    sec.hidden = false;
    sec.querySelector('.grid').innerHTML = '<p class="empty">Searching…</p>';
    api('/api/search', { q: q }).then(function(d){ fill('results', d.results, 'No results for “' + q + '”.'); window.scrollTo(0, 0); })
      .catch(offline);
  };

  function play(v){
    showNow({ title: v.title, series: v.series, thumb: v.thumb, playing: true, t: 0, dur: v.dur || 0 });
    api('/api/play', { path: v.path }).then(function(){ setTimeout(poll, 3000); }).catch(offline);
  }

  // ---- Now playing ----
  var dragging = false, pollTimer = null;
  function showNow(s){
    $('#now').classList.add('on');
    $('#npTitle').textContent = s.title || '';
    $('#npSeries').textContent = s.series || '';
    $('#npSeries').style.display = s.series ? '' : 'none';
    $('#npThumb').style.backgroundImage = s.thumb ? 'url("' + s.thumb.replace(/"/g, '%22') + '")' : '';
    $('#npPlay').textContent = s.playing ? '❚❚' : '▶';
    if (!dragging) {
      $('#npBar').max = Math.max(1, Math.floor(s.dur || 0));
      $('#npBar').value = Math.floor(s.t || 0);
      $('#npT').textContent = fmt(s.t);
    }
    $('#npDur').textContent = fmt(s.dur);
  }
  function poll(){
    clearTimeout(pollTimer);
    if (document.hidden) return;
    api('/api/status').then(function(s){
      banner('');
      if (s.video) showNow(s); else $('#now').classList.remove('on');
    }).catch(offline).then(function(){ pollTimer = setTimeout(poll, 1500); });
  }
  function cmd(c, v){ return api('/api/cmd', v === undefined ? { c: c } : { c: c, v: v }).then(function(){ setTimeout(poll, 400); }).catch(offline); }
  $('#npPlay').onclick = function(){ cmd('toggle'); };
  document.querySelectorAll('[data-seek]').forEach(function(b){ b.onclick = function(){ cmd('seek', b.dataset.seek); }; });
  var bar = $('#npBar');
  bar.oninput = function(){ dragging = true; $('#npT').textContent = fmt(bar.value); };
  bar.onchange = function(){ dragging = false; cmd('seekto', bar.value); };

  document.addEventListener('visibilitychange', function(){ if (!document.hidden) { load(); poll(); } });
  load();
  poll();
})();
</script>
</body>
</html>
