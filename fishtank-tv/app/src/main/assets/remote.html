<!doctype html>
<html lang="en" data-site="__FTV_SITE__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TV Remote</title>
<link rel="manifest" href="/manifest.webmanifest?k=__FTV_KEY__">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- The flavor's look (remote-mde.css / remote-fishtank.css), put in by PhoneRemote. -->
<style>
/*__FTV_CSS__*/
</style>
</head>
<body>
<header>
  <div class="brand"><b id="brand">MDE</b><span>TV REMOTE</span></div>
  <form id="search">
    <input type="search" id="q" placeholder="Search" enterkeyhint="search" autocomplete="off">
    <button>SEARCH</button>
  </form>
  <button id="acctBtn" aria-label="Your account" hidden></button>
</header>
<div id="banner"></div>
<main id="main">
  <section id="results" hidden><div class="head"><h2>Results</h2></div><div class="plist"></div></section>
  <section id="cameras" hidden><div class="head"><h2>Live</h2></div><div class="row"></div></section>
  <div id="recent"></div>
  <section id="spotlight" hidden><div class="head"><h2>Spotlight</h2></div><div class="spot"></div><div class="dots"></div></section>
  <div id="sections"><p class="empty" style="margin-top:18px">Loading…</p></div>
  <div id="shows"></div>
</main>
<div id="acct">
  <div class="sh-head">
    <button id="acBack" aria-label="Back">‹</button>
    <h2 id="acTitle">Account</h2>
  </div>
  <div class="ac-tabs" id="acTabs"></div>
  <div class="ac-body" id="acBody"></div>
</div>
<div id="sheet">
  <div class="sh-head">
    <button id="shBack" aria-label="Back">‹</button>
    <h2 id="shTitle"></h2>
    <button id="shSort"></button>
  </div>
  <div class="list" id="shList"></div>
</div>
<div id="player">
  <div class="pl-bg" id="plBg"></div>
  <div class="pl-main" id="plMain">
   <div class="pl-screen">
    <div class="pl-top">
      <button id="plClose" aria-label="Close" data-icon="down"></button>
      <div class="pl-head"><b id="plTitle"></b><span id="plSub"></span></div>
      <button id="plSeries" aria-label="All episodes" data-icon="list"></button>
    </div>
    <div class="pl-art"><div class="frame" id="plArt"><div class="spin"><i></i><span>Starting on the TV…</span></div></div></div>
    <div class="pl-device"><i data-icon="cast"></i><span id="plDevice">Playing on your TV</span></div>
    <div class="pl-seek" id="plSeek">
      <span id="plT">0:00</span>
      <input type="range" class="scrub" id="plBar" min="0" max="100" step="1" value="0" aria-label="Position">
      <span id="plDur">0:00</span>
    </div>
    <div class="pl-ctrls">
      <button id="plPrev" aria-label="Previous episode" data-icon="prev"></button>
      <button data-seek="-10" aria-label="Back 10 seconds" data-icon="back10"></button>
      <button class="big" id="plPlay" aria-label="Play or pause" data-icon="pause"></button>
      <button data-seek="30" aria-label="Forward 30 seconds" data-icon="fwd30"></button>
      <button id="plNext" aria-label="Next episode" data-icon="next"></button>
    </div>
    <div class="pl-extra">
      <button id="plLike" hidden><i data-icon="like"></i><span>Like</span></button>
      <button id="plDislike" hidden><i data-icon="dislike"></i><span>Dislike</span></button>
      <button id="plCaptions" hidden><i data-icon="cc"></i>Subtitles</button>
      <button id="plRestart"><i data-icon="restart"></i>Restart</button>
      <button id="plStop"><i data-icon="stop"></i>Stop</button>
    </div>
   </div>
    <section class="pl-comments" id="plComments"></section>
  </div>
  <div class="pl-sheet" id="plSheet">
    <div class="ps-grip" id="plGrip"><i></i></div>
    <div class="ps-tabs">
      <button data-tab="next" class="on">Up next</button>
      <button data-tab="more">Episodes</button>
      <button data-tab="about">About</button>
    </div>
    <div class="ps-body" id="plBody">
      <div data-pane="next" id="plQueue"></div>
      <div data-pane="more" id="plMore" hidden></div>
      <div data-pane="about" id="plAbout" hidden></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="now">
  <div class="np-prog"><i id="npProg"></i></div>
  <div class="np" id="npOpen">
    <div class="art" id="npThumb"></div>
    <div class="meta"><b id="npTitle"></b><span><i data-icon="cast"></i><em id="npDevice">Playing on your TV</em></span></div>
    <button id="npPlay" aria-label="Play or pause" data-icon="pause"></button>
  </div>
</div>
<script>
(function(){
  var site = document.documentElement.dataset.site;
  var fishtank = site === 'fishtank';
  var key = new URLSearchParams(location.search).get('k') || '';
  var $ = function(s){ return document.querySelector(s); };
  document.title = (fishtank ? 'Fishtank' : 'MDE') + ' TV Remote';
  $('#brand').textContent = fishtank ? 'fishtank' : 'MDE';
  document.head.insertAdjacentHTML('beforeend', '<meta name="theme-color" content="' + (fishtank ? '#56749f' : '#04080b') + '">' +
    '<meta name="apple-mobile-web-app-title" content="' + (fishtank ? 'Fishtank TV' : 'MDE TV') + '">');

  function api(path, params){
    var u = new URLSearchParams(params || {}); u.set('k', key);
    return fetch(path + '?' + u, { cache: 'no-store' }).then(function(r){
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  }
  function banner(text){ var b = $('#banner'); b.textContent = text || ''; b.style.display = text ? 'block' : 'none'; }
  function fmt(s){
    s = Math.max(0, Math.floor(s || 0));
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
  }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }
  // Lazy <img>s rather than background images: a fishtank season or a long
  // mde series is a lot of thumbnails, and only the ones scrolled to load.
  function img(box, url, eager){
    if (!url) return;
    var i = el('img');
    i.alt = '';
    i.decoding = 'async';
    if (!eager) i.loading = 'lazy';
    i.src = url;
    box.insertBefore(i, box.firstChild);
  }

  function thumb(v){
    var t = el('div', 'thumb');
    img(t, v.thumb);
    if (v.next) t.appendChild(el('div', 'tag', 'UP NEXT'));
    else if (v.elsewhere) t.appendChild(el('div', 'tag', 'ON ANOTHER DEVICE'));
    else if (v.progress > 0) {
      var bar = el('div', 'bar'), fill = el('i');
      fill.style.width = Math.min(100, Math.max(2, v.progress * 100)) + '%';
      bar.appendChild(fill); t.appendChild(bar);
    }
    if (v.watched) t.appendChild(el('div', 'seen', '✓ WATCHED'));
    return t;
  }
  function card(v, rowTitle){
    var b = el('button', 'card');
    b.appendChild(thumb(v));
    if (v.series && v.series !== rowTitle) b.appendChild(el('div', 'series', v.series));
    b.appendChild(el('div', 'title', v.title || ''));
    b.onclick = function(){ play(v); };
    return b;
  }
  // Continue watching's cards, with an × to take one off the list.
  function recentCard(v){
    var b = card(v), x = el('span', 'rm', '×');
    x.setAttribute('role', 'button');
    x.setAttribute('aria-label', 'Remove from Continue watching');
    x.onclick = function(e){ e.stopPropagation(); removeRecent(v); };
    b.querySelector('.thumb').appendChild(x);
    return b;
  }
  function removeRecent(v){
    api('/api/recent/remove', { path: v.path }).then(function(d){
      showRecent(d.recent);
      if (sheetOpen && $('#shTitle').textContent === 'Continue watching') { sheetItems = d.recent || []; renderSheet(); }
      toast('Removed from Continue watching');
    }).catch(offline);
  }
  function showRecent(list){
    replace($('#recent'), rowSection('Continue watching', list, recentCard, null, true,
      function(v){ return { actions: [['×', function(){ removeRecent(v); }, 'Remove from Continue watching']] }; }));
  }
  // One line of a list: thumbnail beside the title, then its buttons.
  // o: { label: small caption, cur: the episode on the TV, actions: [[text, fn]] }
  // (by default, + to add it to the queue).
  function line(v, listTitle, o){
    o = o || {};
    var row = el('div', 'li' + (o.cur ? ' cur' : '')), b = el('button', 'go'), t = thumb(v), m = el('div', 'meta');
    if (v.dur && !v.progress && !v.next) t.appendChild(el('div', 'dur', fmt(v.dur)));
    b.appendChild(t);
    // A series' own list doesn't need its name on every line.
    if (v.series && v.series !== listTitle) m.appendChild(el('div', 'series', v.series));
    m.appendChild(el('div', 'title', v.title || ''));
    if (o.label) m.appendChild(el('div', 'label', o.label));
    b.appendChild(m);
    b.onclick = function(){ if (!o.cur) play(v); };
    row.appendChild(b);
    (o.actions || (o.cur ? [] : [['+', function(){ enqueue(v); }]])).forEach(function(a){
      var x = el('button', 'act', a[0]);
      x.setAttribute('aria-label', a[2] || (a[0] === '+' ? 'Add to queue' : a[0]));
      x.onclick = a[1];
      row.appendChild(x);
    });
    return row;
  }

  var toastTimer = null;
  function toast(text){
    var t = $('#toast');
    t.textContent = text;
    t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 1800);
  }
  function cameraCard(c){
    var b = el('button', 'card cam'), t = el('div', 'thumb', c.thumb ? '' : c.name);
    img(t, c.thumb, true);
    t.appendChild(el('div', 'live' + (c.online ? '' : ' off'), c.online ? '● LIVE' : 'Offline'));
    b.appendChild(t);
    b.appendChild(el('div', 'title', c.name));
    b.onclick = function(){ camera(c); };
    return b;
  }
  // mde's Series, as its homepage shows them: square tiles two across, the
  // name on top, and how many episodes you've finished along the bottom.
  function showCard(s){
    var b = el('button', 'scard');
    img(b, s.thumb);
    b.appendChild(el('div', 'st', s.title));
    var foot = el('div', 'sb');
    if (s.watched > 0 && s.episodes) {
      var bar = el('i'), fill = el('b');
      fill.style.width = Math.min(100, s.watched / s.episodes * 100) + '%';
      bar.appendChild(fill);
      foot.appendChild(bar);
      foot.appendChild(el('span', 'n', s.watched + '/' + s.episodes));
    }
    if (s.episodes) foot.appendChild(el('span', 'eps', s.episodes + (s.episodes === 1 ? ' episode' : ' episodes')));
    b.appendChild(foot);
    b.onclick = function(){ openSheet(s.title, api('/api/series', { tag: s.tag }).then(function(d){ return d.items; })); };
    return b;
  }
  function seriesGrid(list){
    var sec = el('section'), head = el('div', 'head'), grid = el('div', 'sgrid');
    head.appendChild(el('h2', '', 'Series'));
    sec.appendChild(head);
    list.forEach(function(s){ grid.appendChild(showCard(s)); });
    sec.appendChild(grid);
    return sec;
  }
  function fill(sec, list, make, emptyText, title){
    var box = sec.querySelector('.row, .grid, .plist');
    box.innerHTML = '';
    (list || []).forEach(function(v){ box.appendChild(make(v, title)); });
    if (!list || !list.length) {
      if (!emptyText) { sec.hidden = true; return; }
      box.appendChild(el('p', 'empty', emptyText));
    }
    sec.hidden = false;
  }
  // A titled row, with "See all" when there's more than a screen of it.
  // lineOpts(v): options for each line of its "All" list (see line()).
  // fishtank's tab icons, as on its Episodes page (game-icons.net, CC BY 3.0):
  // a fishbowl for seasons, pages for digests, a clapperboard for the rest,
  // and its "Latest Episode" one for Continue watching.
  var FT_TAB_ICONS = {"season": "<path d=\"M96 39c-4.75 0-8.688.388-12.613 2.385-3.926 1.997-7.284 6.946-7.61 11.176-.65 8.46 3.415 12.92 6.506 18.07 3.09 5.152 6.22 10.342 7.428 13.966 1.21 3.623 1.275 3.692-.073 5.04l-.035.034-.034.035C48.298 131.88 23 192.615 23 256c0 84.586 49.342 158.86 116.316 199.686C176.136 478.13 214.018 473 256 473c41.406 0 80.11 4.575 116.62-17.277C440.496 415.1 489 341.143 489 256c0-63.218-25.516-124.14-66.553-166.28l-.04-.042-.044-.04c-1.348-1.35-1.282-1.42-.074-5.042 1.207-3.624 4.336-8.814 7.427-13.965 3.09-5.15 7.156-9.61 6.506-18.07-.326-4.23-3.684-9.178-7.61-11.175C424.688 39.388 420.75 39 416 39H96zm0 18h320c.277 0 .127.03.38.037-.584 1.346-1.09 2.656-2.097 4.332-2.91 4.848-6.78 10.658-9.072 17.534-2.29 6.877-2.225 16.808 4.427 23.46l-.084-.085C447.116 140.852 471 197.657 471 256c0 78.296-44.763 146.655-107.62 184.277C332.713 458.63 298.577 455 256 455c-43.3 0-76.282 4.233-107.316-14.686C86.65 402.5 41 333.556 41 256c0-58.569 23.653-115.098 61.432-153.705l-.07.068c6.653-6.65 6.72-16.582 4.427-23.46-2.293-6.875-6.164-12.685-9.073-17.534-1.006-1.677-1.513-2.987-2.096-4.333.253-.008.103-.037.38-.037zm87.484 61.742c-3.14-.01-6.395.055-9.734.186-20.032.785-43.117 3.942-63.287 7.217-2.172.352-4.24.706-6.332 1.06-5.374 5.666-10.308 12.474-14.8 20.115-.174.296-.34.6-.514.9 7.16-1.346 15.486-2.84 24.532-4.308 26.376-4.282 58.298-8.124 78.11-6.928 40.6 2.452 80.8 29.15 128 32 23.11 1.396 55.185-2.763 82.08-7.13 9.824-1.594 18.89-3.226 26.49-4.665-2.093-4.34-4.305-8.55-6.655-12.547-.815-1.386-1.65-2.734-2.494-4.063-6.142 1.128-12.943 2.325-20.228 3.508-26.376 4.282-58.298 8.124-78.11 6.928-40.6-2.452-80.8-29.15-128-32-2.888-.175-5.916-.263-9.058-.274zm-66.115 42.77l-30.026 2.88A192 192 0 0 0 64 256a192 192 0 0 0 62.63 141.56A224 224 0 0 1 87.88 272a224 224 0 0 1 29.49-110.488zm250.806 13.435a24 24 0 0 0-24 24 24 24 0 0 0 24 24 24 24 0 0 0 24-24 24 24 0 0 0-24-24zm30.83 78.46a16 16 0 0 0-16 16 16 16 0 0 0 16 16 16 16 0 0 0 16-16 16 16 0 0 0-1 7.084 10.51-56.803-31.715 37.084-10.51zm-61.577 17.45l56.803 31.716-37.084 10.51-56.8-31.717 37.08-10.51zm-61.574 17.45l56.8 31.715-37.083 10.51-56.802-31.715 37.084-10.51zm-45.86 26.227l41.085 22.94-32.01 9.072-9.074-32.012zM55 215v274h402V215H55zm18 18h33.273L73 266.273V233zm58.727 0h38.546l-46 46H85.727l46-46zm64 0h38.546l-46 46h-38.546l46-46zm64 0h38.546l-46 46h-38.546l46-46zm64 0h38.546l-46 46h-38.546l46-46zm64 0h38.546l-46 46h-38.546l46-46zM439 245.727V279h-33.273L439 245.727zM73 297h366v174H73V297zm248.635 46.57l-192.44.703.067 18 192.44-.703-.067-18zM130.7 391.33l-.134 17.998 92.707.703.137-18-92.71-.7zm127.155.7l-.2 18 63.913.702.2-17.998-63.913-.703z\"></path>", "latest": "<path d=\"M55 18v476h18v-37h46v37h274v-37h46v37h18V18h-18v37h-46V18h-18v60H137V18h-18v37H73V18H55zm18 55h46v46H73V73zm320 0h46v46h-46V73zm-256 41h238v156H137V114zm-64 23h46v46H73v-46zm320 0h46v46h-46v-46zM73 201h46v46H73v-46zm320 0h46v46h-46v-46zM73 265h46v46H73v-46zm320 0h46v46h-46v-46zm-256 41h238v156H137V306zm-64 23h46v46H73v-46zm320 0h46v46h-46v-46zM73 393h46v46H73v-46zm320 0h46v46h-46v-46z\"></path>"};
  function ftTabIcon(title){
    var k = /season \d+$/i.test(title) ? 'season' : /digest/i.test(title) ? 'digest' : /continue|latest/i.test(title) ? 'latest' : 'film';
    return '<svg viewBox="0 0 512 512" aria-hidden="true">' + FT_TAB_ICONS[k] + '</svg>';
  }
  function rowSection(title, list, make, emptyText, seeAll, lineOpts){
    var sec = el('section'), head = el('div', 'head'), h = el('h2', '', title);
    if (fishtank) h.insertAdjacentHTML('afterbegin', ftTabIcon(title));
    head.appendChild(h);
    if (seeAll && list && list.length > 3) {
      var more = el('button', 'more', 'All ›');
      more.onclick = function(){ openSheet(title, Promise.resolve(list), lineOpts); };
      head.appendChild(more);
    }
    sec.appendChild(head);
    sec.appendChild(el('div', 'row'));
    fill(sec, list, make, emptyText, title);
    return sec;
  }
  function replace(box, sec){ box.innerHTML = ''; if (sec && !sec.hidden) box.appendChild(sec); }

  // ---- Spotlight ----
  var spotTimer = null;
  function spotlight(list){
    var sec = $('#spotlight'), track = sec.querySelector('.spot'), dots = sec.querySelector('.dots');
    clearInterval(spotTimer);
    track.innerHTML = ''; dots.innerHTML = '';
    if (!list || !list.length) { sec.hidden = true; return; }
    list.forEach(function(v, i){
      var s = el('button', 'slide'), cap = el('div', 'cap');
      img(s, v.thumb, i === 0);
      if (v.series) cap.appendChild(el('div', 'series', v.series));
      cap.appendChild(el('div', 'title', v.title || ''));
      s.appendChild(cap);
      s.onclick = function(){ play(v); };
      track.appendChild(s);
      // Numbered like the site's 1-7 buttons; tap one to go to that slide.
      var d = el('i', '', String(i + 1));
      d.onclick = function(){ clearInterval(spotTimer); track.scrollTo({ left: i * (track.clientWidth + 10), behavior: 'smooth' }); };
      dots.appendChild(d);
    });
    sec.hidden = false;
    var at = function(){ return Math.round(track.scrollLeft / Math.max(1, track.clientWidth)); };
    var mark = function(){ var n = at(); [].forEach.call(dots.children, function(d, i){ d.classList.toggle('on', i === n); }); };
    track.onscroll = mark;
    mark();
    // Turns over like the site's, until the phone user swipes it themselves.
    var go = function(){

    api('/api/like', { id: ep.id, v: up ? 'like' : 'dislike' }).then(function(d){

      if (typeof d.dislikes === 'number') ep.dislikes = d.dislikes;
      if (plEp === ep) renderLikes();
    }).catch(function(){
      ep.myLike = before.myLike; ep.likes = before.likes; ep.dislikes = before.dislikes;

  function ago(iso){

      box.appendChild(bgs);
    }
    var acts = el('div', 'ac-actions'), save = el('button', 'primary', 'Save'), reset = el('button', '', 'Reset');
    var send = function(theme, msg){
      save.disabled = reset.disabled = true;
      api('/api/theme/set', { v: JSON.stringify(theme) }).then(function(){ toast(msg); return loadAccount(); })
        .catch(function(){ toast('Couldn’t reach the TV'); })
        .then(function(){ save.disabled = reset.disabled = false; });
    };
    save.onclick = function(){
      send(fishtank ? { settings: vals } : { colors: vals, background: bg }, 'Theme set on the TV');
    };
    reset.onclick = function(){
      var d = {};
      spec.forEach(function(s){ d[s[0]] = s[2]; });
      send(fishtank ? { settings: null } : { colors: d, background: null }, 'Theme reset on the TV');
    };
    acts.appendChild(save);
    acts.appendChild(reset);
    box.appendChild(acts);
  }

  document.addEventListener('visibilitychange', function(){ if (!document.hidden) { load(); poll(); } });
  loadAccount().catch(function(){});
  load();
  poll();
})();
</script>
</body>
</html>
